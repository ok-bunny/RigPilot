# Evaluate the existing per-boot hardware guard before starting the vendor daemon.
# Keep the NVIDIA service available when usable hardware is present; skip a
# predictable failed start when the guard has disabled driver probing.
[Unit]
Requires=rigpilotos-nvidia-guard.service
After=rigpilotos-nvidia-guard.service
ConditionPathExists=!/run/modprobe.d/rigpilotos-no-nvidia.conf
