services:
  rigpilot:
    build: .
    container_name: rigpilot
    restart: unless-stopped
    environment:
      RIGPILOT_ADMIN_USERNAME: ${RIGPILOT_ADMIN_USERNAME:-admin}
      RIGPILOT_ADMIN_PASSWORD: ${RIGPILOT_ADMIN_PASSWORD:?Set RIGPILOT_ADMIN_PASSWORD in .env}
      # Omit an unset key so the server persists its generated /data/secret.key.
      RIGPILOT_SECRET_KEY:
      RIGPILOT_DATA_DIR: /data
      RIGPILOT_REQUIRE_HTTPS: ${RIGPILOT_REQUIRE_HTTPS:-false}
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1}
      RIGPILOT_TELEMETRY_RETENTION_DAYS: ${RIGPILOT_TELEMETRY_RETENTION_DAYS:-2}
      RIGPILOT_HASHRATE_HISTORY_RETENTION_DAYS: ${RIGPILOT_HASHRATE_HISTORY_RETENTION_DAYS:-14}
      RIGPILOT_NVIDIA_CACHE_MAX_BYTES: ${RIGPILOT_NVIDIA_CACHE_MAX_BYTES:-2147483648}
      RIGPILOT_NVIDIA_CACHE_MAX_SET_BYTES: ${RIGPILOT_NVIDIA_CACHE_MAX_SET_BYTES:-1073741824}
      RIGPILOT_NVIDIA_CACHE_MIN_FREE_BYTES: ${RIGPILOT_NVIDIA_CACHE_MIN_FREE_BYTES:-2147483648}
      RIGPILOT_NVIDIA_CACHE_KEEP_VERSIONS: ${RIGPILOT_NVIDIA_CACHE_KEEP_VERSIONS:-3}
      RIGPILOT_NVIDIA_CACHE_RETENTION_DAYS: ${RIGPILOT_NVIDIA_CACHE_RETENTION_DAYS:-14}
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - rigpilot-data:/data

volumes:
  rigpilot-data:
